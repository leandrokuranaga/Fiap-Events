name: Deploy to AWS Lambda

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar credenciais da AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Instalar Amazon Lambda Tools
        run: dotnet tool install -g Amazon.Lambda.Tools

      - name: Restaurar dependências
        run: dotnet restore

      - name: Build da aplicação
        run: dotnet build --configuration Release --no-restore

      - name: Deploy para AWS Lambda
        run: |
          dotnet lambda deploy-function \
            --function-name "Fiap-Event" \
            --framework "net8.0" \
            --function-runtime "dotnet8" \
            --architecture "x86_64" \
            --function-memory-size 512 \
            --function-timeout 30 \
            --role "arn:aws:iam::433980487130:role/AWSLambdaSQSQueueExecutionFunction" \
            --function-handler "Fiap.Events.Functions::Fiap.Events.Functions.Function::CreateUserFunction" \
            --disable-interactive true
        working-directory: ./src/Fiap.Events.Services/Fiap.Events.Services
        env:
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
